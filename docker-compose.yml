services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    command: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
    restart: "no"
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
  api:
    build: .
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/full_product_management?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
  worker:
    build: .
    command: ["node", "worker.js"]
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/full_product_management?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
volumes:
  mongo-data:
  redis-data:
